# CPU 综合排行 → 调度 cpu_coeff
# 替换本文件或设 V8_CPU_RANK_PATH 指向新文件后调用 reload / 重启即可
#
# ── 来源与更新口径（2026-09-17 补记 · 仅注释，未改动任何条目值）──────────────
# ⚠️ 既有 48 条条目的原始依据【无从考证】：仓库内无生成脚本、无基准说明、无维护者
#    记录、无更新日期口径（已全仓检索 cpu_rank / CPU 排行 / PassMark / Geekbench，
#    零命中）。在补证前，下表条目应视为"未经审计"的排序。
# ▶ 建议的更新口径（提案 · 待 owner 确认后生效；确认前不构成既定规则）：
#     数据基准（候选 · 公开可引用）：
#       - PassMark CPU Mark              https://www.cpubenchmark.net/
#       - Geekbench Browser（单/多核）    https://browser.geekbench.com/
#     维护者：<待指定>
#     更新节奏：<待定>
#     更新方式：替换本文件，或 V8_CPU_RANK_PATH 指向新表 + reload/重启
# ▶ 匹配口径提醒：`match` 为"小写子串匹配"，必须与节点实际上报的 cpu_brand 形态对齐。
#    实测：大量 Intel 笔记本 HX/H/U 与 AMD 全系匹配不上 → cpu_coeff=0 → 落兜底上限 0.55。
# ───────────────────────────────────────────────────────────────────────

# ── 编辑规范（2026-09-17 · 配合 loader 的显式 coeff 支持）─────────────────
# 改这张表时【优先给新条目写显式 coeff】。原因：档内系数是「档位基准 × (1 − 0.08 × i/n)」
# 算出来的，n = 该档条目总数 ⇒ 纯靠 grade/rank 新增一条会【重排同档所有既有条目】。
# 写了 coeff 的条目不进入 i/n 统计 ⇒ 对既有条目零影响（2026-09-17 新增 20 条即按此办理）。
# 非法 coeff（负数 / >1 / 非数字）会让整表回退空表并打 logger.error，不会静默取值。
